name: Android APK

# Generated recompiler output is derived from copyrighted ROM bytes and is not
# stored in Git. This workflow uses the same maintainer-provided, short-lived
# generated-code archive as the desktop release workflow; the ROM itself never
# enters Actions and is never packaged in the APK.
on:
  workflow_dispatch:
    inputs:
      generated_sha256:
        description: SHA-256 of the private generated-code archive
        required: true
        type: string
      build_type:
        description: APK variant
        required: true
        default: release
        type: choice
        options: [release, debug]

concurrency:
  group: supermetroid-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/*.gradle

      - name: Validate generated-code input
        env:
          INPUT_SHA256: ${{ inputs.generated_sha256 }}
        run: '[[ "$INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]'

      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Restore private generated program
        env:
          INPUT_URL: ${{ secrets.SM_GENERATED_CODE_URL }}
          INPUT_SHA256: ${{ inputs.generated_sha256 }}
        run: |
          set -euo pipefail
          [[ -n "$INPUT_URL" ]] || { echo "::error::Set SM_GENERATED_CODE_URL to a short-lived generated-code archive"; exit 1; }
          curl --fail --silent --show-error --location "$INPUT_URL" --output "$RUNNER_TEMP/sm-generated.tar.gz"
          python3 tools/release_payload.py restore "$RUNNER_TEMP/sm-generated.tar.gz" --sha256 "$INPUT_SHA256"
          rm "$RUNNER_TEMP/sm-generated.tar.gz"

      - name: Fetch pinned SDL Android source
        run: bash android/fetch_sdl.sh

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew --stacktrace assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Collect APK and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk \
             artifacts/SuperMetroidRecomp-${{ inputs.build_type }}-arm64.apk
          (cd artifacts && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: supermetroid-android-${{ inputs.build_type }}-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
